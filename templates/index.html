<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ nombre }} · {{ escuela }}</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --vino:#7a0f2e;--vino2:#9b1b42;--vino-prof:#32061a;
  --degradado:linear-gradient(135deg,#8c1237,#58091f);
  --fondo:#f5e4e9;--oro:#e8c9a0;--tinta:#2b1219;--borde:#e0b9c4
}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--vino-prof);color:var(--tinta);min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:860px;display:flex;flex-direction:column;height:100vh;background:var(--fondo)}
header{background:var(--degradado);color:#fbeff2;padding:16px 24px;border-bottom:4px solid var(--oro)}
header h1{font:800 1.7rem Fraunces,Georgia,serif;margin:0;line-height:1.1}
header p{margin:4px 0 0;font-size:.95rem;opacity:.88}
#msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.m{max-width:82%;padding:12px 16px;border-radius:14px;line-height:1.5;white-space:pre-wrap;font-size:1rem;overflow-wrap:anywhere}
.bot{background:#fff;border:1px solid var(--borde);align-self:flex-start;border-top-left-radius:2px}
.yo{background:var(--vino2);color:#fbeff2;align-self:flex-end;border-bottom-right-radius:2px}
.pensando{display:flex;align-items:center;gap:10px;color:#7a4b58;font-style:italic}
.puntos{display:inline-flex;gap:4px}
.puntos i{width:7px;height:7px;border-radius:50%;background:var(--vino2);opacity:.5}
.op{display:block;margin-top:8px;background:var(--fondo);border:1px solid var(--vino);color:var(--vino);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.op:hover,.op:focus-visible{background:var(--vino);color:#fbeff2}
.sug{display:flex;flex-wrap:wrap;gap:8px;padding:0 22px 10px}
.sug button{background:transparent;border:1px solid var(--vino);color:var(--vino);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:.9rem}
.sug button:hover,.sug button:focus-visible{background:var(--vino);color:#fbeff2}
form{display:flex;gap:10px;padding:14px 22px;background:var(--degradado)}
input[type=text]{flex:1;min-width:0;border:0;border-radius:999px;padding:13px 18px;font:inherit;font-size:1rem}
form button{border:0;border-radius:999px;padding:0 20px;font:700 1rem Nunito,sans-serif;cursor:pointer;background:var(--oro);color:var(--vino);white-space:nowrap}
form button:hover{filter:brightness(1.06)}
#mic.on{background:#c7352b;color:#fff}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
@media(max-width:600px){.m{max-width:94%}header p{font-size:.85rem}}
@media(prefers-reduced-motion:no-preference){
  .m{animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .puntos i{animation:salto 1s infinite}
  .puntos i:nth-child(2){animation-delay:.15s}
  .puntos i:nth-child(3){animation-delay:.3s}
  @keyframes salto{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-4px)}}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>{{ nombre }}</h1>
    <p>{{ escuela }}</p>
  </header>
  <div id="msgs" aria-live="polite"></div>
  <div class="sug" id="sug"></div>
  <form id="f">
    <button type="button" id="mic" title="Hablar por el micrófono">🎤 Hablar</button>
    <input type="text" id="txt" placeholder="Escribe tu duda o trámite…" autocomplete="off" autofocus>
    <button type="submit">Enviar</button>
  </form>
</div>
<script>
const $ = s => document.querySelector(s), msgs = $('#msgs');
let contexto = null;          // último trámite del que se habló (para preguntas como "¿dónde queda?")
let ocupado = false;
const esperar = ms => new Promise(r => setTimeout(r, ms));

function burbuja(clase){
  const d = document.createElement('div');
  d.className = 'm ' + clase;
  return d;
}

function agregar(texto, clase, opciones){
  const d = burbuja(clase);
  d.textContent = texto;
  (opciones || []).forEach(o => {
    const b = document.createElement('button');
    b.className = 'op'; b.type = 'button'; b.textContent = o.texto;
    b.onclick = () => enviar({tag: o.tag, visible: o.texto});
    d.appendChild(b);
  });
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  return d;
}

// Indicador "CuerviFriend está leyendo": puntos animados y un texto que cambia mientras analiza
function indicador(){
  const d = burbuja('bot pensando');
  const puntos = document.createElement('span'); puntos.className = 'puntos';
  puntos.innerHTML = '<i></i><i></i><i></i>';
  const t = document.createElement('span'); t.textContent = 'Leyendo tu mensaje…';
  d.append(puntos, t);
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  const fase = setTimeout(() => { t.textContent = 'Buscando la mejor respuesta…'; }, 800);
  return {
    texto(x){ clearTimeout(fase); t.textContent = x; },
    quitar(){ clearTimeout(fase); d.remove(); }
  };
}

// En el plan gratis de Render el servidor se duerme; si no responde, reintenta unos segundos
async function pedir(cuerpo, ind){
  for (let intento = 0; intento < 6; intento++){
    try {
      const r = await fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(cuerpo)
      });
      if (r.ok) return await r.json();
    } catch (_) {}
    ind.texto('Despertando al servidor, un momento…');
    await esperar(5000);
  }
  return null;
}

async function enviar(entrada){
  if (ocupado) return;
  const esTag = typeof entrada === 'object';
  const texto = esTag ? entrada.visible : String(entrada || '').trim();
  if (!texto) return;
  ocupado = true;
  agregar(texto, 'yo'); $('#txt').value = '';
  const ind = indicador();
  const t0 = performance.now();
  const j = await pedir(esTag ? {tag: entrada.tag, contexto} : {mensaje: texto, contexto}, ind);
  if (!j){
    ind.quitar();
    agregar('No pude conectar con el servidor. Recarga la página e inténtalo de nuevo.', 'bot');
    ocupado = false; return;
  }
  // Pausa de 1 a 2 segundos para que se note que lee y analiza el mensaje (más larga si la respuesta es larga)
  const demora = 900 + Math.min(900, j.respuesta.length * 4) + Math.random() * 200;
  const falta = demora - (performance.now() - t0);
  if (falta > 0) await esperar(falta);
  ind.quitar();
  contexto = j.contexto || null;
  agregar(j.respuesta, 'bot', j.opciones);
  ocupado = false;
  $('#txt').focus();
}

$('#f').onsubmit = e => { e.preventDefault(); enviar($('#txt').value); };

// Micrófono: en localhost usa Python (SpeechRecognition + PyAudio); en un link público usa el dictado del navegador.
let modoMic = 'navegador';
fetch('/api/config').then(r => r.json()).then(c => { modoMic = c.microfono; }).catch(() => {});

function botonMic(escuchando){
  const b = $('#mic');
  b.classList.toggle('on', escuchando);
  b.textContent = escuchando ? '🎙️ Escuchando…' : '🎤 Hablar';
}

async function dictadoServidor(){
  botonMic(true);
  try {
    const j = await (await fetch('/api/escuchar', {method: 'POST'})).json();
    botonMic(false);
    if (j.ok) enviar(j.texto); else agregar(j.error, 'bot');
  } catch (e) {
    botonMic(false);
    agregar('Error con el micrófono. Revisa que app.py siga corriendo.', 'bot');
  }
}

function dictadoNavegador(){
  const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Reconocimiento){
    agregar('Este navegador no permite dictado por voz. Usa Chrome o Edge, o escribe tu duda.', 'bot');
    return;
  }
  const rec = new Reconocimiento();
  rec.lang = 'es-MX'; rec.interimResults = false; rec.maxAlternatives = 1;
  let hubo = false;
  rec.onstart = () => botonMic(true);
  rec.onresult = e => { hubo = true; enviar(e.results[0][0].transcript); };
  rec.onerror = e => {
    hubo = true;
    const mensajes = {
      'not-allowed': 'Permite el uso del micrófono en tu navegador (el candado junto a la dirección) e inténtalo de nuevo.',
      'service-not-allowed': 'Permite el uso del micrófono en tu navegador e inténtalo de nuevo.',
      'no-speech': 'No te escuché, intenta de nuevo.',
      'audio-capture': 'No encontré un micrófono conectado.',
      'network': 'No pude conectarme al servicio de voz. Revisa tu internet.'
    };
    agregar(mensajes[e.error] || 'No pude usar el micrófono. Escribe tu duda.', 'bot');
  };
  rec.onend = () => { botonMic(false); if (!hubo) agregar('No te escuché, intenta de nuevo.', 'bot'); };
  try { rec.start(); } catch (_) { botonMic(false); }
}

$('#mic').onclick = () => {
  if (ocupado) return;
  if (modoMic === 'servidor') dictadoServidor(); else dictadoNavegador();
};

agregar('¡Hola! Soy tu amigo CuerviFriend, estoy listo para apoyarte con tus trámites del Tecnológico de Nuevo León. Escríbeme tu duda con tus palabras o usa el micrófono.', 'bot');
['Necesito una constancia', 'Quiero una beca', 'Cómo libero mi servicio social', 'Qué onda'].forEach(t => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = t;
  b.onclick = () => enviar(t); $('#sug').appendChild(b);
});
</script>
</body>
</html>
